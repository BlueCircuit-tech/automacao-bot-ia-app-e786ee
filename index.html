<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A5F">
  <title>PrimeShield — Películas Premium e PPF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              naval: '#1E3A5F',
              azul: '#2563EB',
              gelo: '#F8FAFC',
              profundo: '#132A45',
              claro: '#E8F0FE',
              linha: '#D9E4F2'
            }
          },
          fontFamily: {
            app: ['"Exo 2"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html {
      background: #E8F0FE;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: #E8F0FE;
      color: #1E3A5F;
      font-family: "Exo 2", sans-serif;
    }

    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      overflow-x: hidden;
      background: #F8FAFC;
      box-shadow: 0 0 38px rgba(30, 58, 95, 0.16);
    }

    .app-nav {
      position: fixed;
      z-index: 50;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 7px 5px calc(7px + env(safe-area-inset-bottom));
      border-top: 1px solid #D9E4F2;
      background: rgba(248, 250, 252, 0.97);
      box-shadow: 0 -8px 24px rgba(30, 58, 95, 0.09);
      backdrop-filter: blur(14px);
    }

    .nav-button {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 53px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      border-radius: 11px;
      color: #64748B;
      background: transparent;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .nav-button:active {
      transform: scale(0.94);
    }

    .nav-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.9;
    }

    .nav-button span {
      display: block;
      width: 100%;
      padding: 0 1px;
      overflow: hidden;
      font-size: 8px;
      font-weight: 700;
      line-height: 1.05;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-button.ativo {
      color: #2563EB;
      background: #E8F0FE;
    }

    .nav-button.ativo::before {
      position: absolute;
      top: -7px;
      width: 24px;
      height: 3px;
      border-radius: 0 0 999px 999px;
      background: #2563EB;
      content: "";
    }

    main {
      min-height: 100vh;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main>
    <!-- TELAS -->
    </main>

    <nav class="app-nav grid grid-cols-6" aria-label="Navegação principal">
      <button type="button" class="nav-button" data-nav="inicio-premium" onclick="mostrarTela('inicio-premium')" aria-label="Início Premium">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 11 9-8 9 8"></path>
          <path d="M5 10v10h14V10"></path>
          <path d="M9 20v-6h6v6"></path>
        </svg>
        <span>Início</span>
      </button>

      <button type="button" class="nav-button" data-nav="escolher-servico" onclick="mostrarTela('escolher-servico')" aria-label="Escolher Serviço">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 17h14"></path>
          <path d="M7 17 9 8h6l2 9"></path>
          <path d="M8 12h8"></path>
          <circle cx="7" cy="18" r="2"></circle>
          <circle cx="17" cy="18" r="2"></circle>
        </svg>
        <span>Serviços</span>
      </button>

      <button type="button" class="nav-button" data-nav="agendar-atendimento" onclick="mostrarTela('agendar-atendimento')" aria-label="Agendar Atendimento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M16 3v4M8 3v4M3 10h18"></path>
          <path d="m9 15 2 2 4-4"></path>
        </svg>
        <span>Agendar</span>
      </button>

      <button type="button" class="nav-button" data-nav="orcamento-e-pagamento" onclick="mostrarTela('orcamento-e-pagamento')" aria-label="Orçamento e Pagamento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M3 10h18"></path>
          <path d="M7 15h3"></path>
        </svg>
        <span>Pagamento</span>
      </button>

      <button type="button" class="nav-button" data-nav="suporte-inteligente" onclick="mostrarTela('suporte-inteligente')" aria-label="Suporte Inteligente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
          <path d="M8 9h8M8 13h5"></path>
        </svg>
        <span>Suporte</span>
      </button>

      <button type="button" class="nav-button" data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')" aria-label="Painel Administrativo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Painel</span>
      </button>
    </nav>
  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('inicio-premium');
    });
  </script>
</body>
</html>
